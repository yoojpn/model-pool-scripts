name: Judge v3 retry shard58
on: workflow_dispatch

jobs:
  judge:
    strategy:
      fail-fast: false
      matrix:
        shard: [58]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript
        run: npm install -g typescript ts-node
      - name: Run judge shard
        run: python3 judge_shard_v3.py --shard ${{ matrix.shard }} --total 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results3-shard-${{ matrix.shard }}
          path: output_v2_shard_*.jsonl
