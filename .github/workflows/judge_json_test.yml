name: Judge json test
on: workflow_dispatch
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install -g typescript@5.4.5 ts-node@10.9.2 @types/node@20
      - run: REPAIR_INPUT=repair_test_input.jsonl python3 judge_json.py --shard 0 --total 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-judged
          path: output_repair_judged.jsonl
