name: data
on:
  push:
    branches: ['data/**']
    paths: ['data2/go']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install datasets
      - run: |
          mkdir -p data2
          python train/probe_ds.py nebius/SWE-rebench-openhands-trajectories 150 2>&1 | grep -v "^Generating\|Warning" | tee data2/probe.txt
          gzip -f data2/sample_*.jsonl
          git config user.name swe-runner; git config user.email swe@example.invalid
          git add data2; git commit -qm "data probe" || true
          git pull -q --rebase origin ${{ github.ref_name }} || true
          git push -q origin HEAD:${{ github.ref_name }}
