name: gen
on:
  push:
    branches: ['gen/**']
    paths: ['gen/go']
permissions:
  contents: write
jobs:
  sel:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.s.outputs.repos }}
    steps:
      - run: pip install datasets
      - id: s
        run: |
          python - <<'PY' | tee -a $GITHUB_OUTPUT
          import json, collections
          from datasets import load_dataset
          ds = load_dataset('princeton-nlp/SWE-bench', split='train')
          c = collections.Counter(ds['repo'])
          print(c.most_common(40), file=__import__('sys').stderr)
          print('repos=' + json.dumps([r for r, _ in c.most_common(14)]))
          PY
  gen:
    needs: sel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.sel.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install datasets unidiff
      - name: build
        run: |
          read CAP SEED < gen/go
          mkdir -p gen/out
          python train/gen_oracle.py '${{ matrix.repo }}' $CAP $SEED gen/out/$(echo '${{ matrix.repo }}' | tr / _).jsonl 2>&1 | tail -60 | tee gen/out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'gen-${{ strategy.job-index }}', path: gen/out }
  collect:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'gen-*', path: all }
      - run: |
          mkdir -p data; cat all/*/*.jsonl > data/oracle.jsonl || true
          wc -l data/oracle.jsonl | tee data/count.txt
          for d in all/gen-*; do echo "== $d"; tail -3 $d/log.txt; done > data/logs.txt || true
          gzip -f data/oracle.jsonl
          git config user.name swe-runner; git config user.email swe@example.invalid
          git add data; git commit -qm "oracle data" || true
          git pull -q --rebase origin ${{ github.ref_name }} || true
          git push -q origin HEAD:${{ github.ref_name }}
